<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>병원 재고</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="병원 재고">
<meta name="theme-color" content="#0d7399">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- manifest 를 일부러 연결하지 않음: 초대 링크(#join=...)가 홈 화면 아이콘 주소에 그대로 남도록 -->
<style>
:root {
  --bg: #f2f2f7; --card: #ffffff; --text: #111; --sub: #6b6b70; --line: #e3e3e8;
  --accent: #0d7399; --accent-soft: #e2f1f7; --red: #e0352b; --orange: #d97706; --green: #1a8f4a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --card: #1c1c1e; --text: #f2f2f2; --sub: #9a9aa0; --line: #2e2e32;
    --accent: #4fb3d9; --accent-soft: #10303d; --red: #ff5a4f; --orange: #f5a524; --green: #3ccf75;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 16px; padding-bottom: calc(70px + env(safe-area-inset-bottom));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

header.top {
  position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
}
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 28px; margin: 4px 0; }
.icon-btn {
  border: none; background: var(--accent-soft); color: var(--accent); width: 38px; height: 38px;
  border-radius: 19px; font-size: 22px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
}
.datebar { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.datebar input[type=date] {
  flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); font-weight: 600; text-align: center;
}
.chip { border: none; background: var(--card); border-radius: 10px; padding: 8px 12px; color: var(--accent); font-weight: 600; }
.search {
  width: 100%; margin-top: 8px; padding: 9px 12px; border-radius: 10px; border: none;
  background: color-mix(in srgb, var(--sub) 15%, transparent);
}
.hint { color: var(--sub); font-size: 13px; padding: 4px 20px 0; }

.group-title { color: var(--sub); font-size: 13px; font-weight: 600; padding: 18px 20px 6px; }
.card { background: var(--card); border-radius: 12px; margin: 0 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; border-top: 1px solid var(--line); min-height: 56px; }
.row:first-child { border-top: none; }
.row .info { flex: 1; min-width: 0; }
.row .name { font-weight: 500; display: flex; align-items: center; gap: 6px; }
.row .name .dot { width: 7px; height: 7px; border-radius: 4px; background: var(--accent); flex: none; }
.row .meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
.row .shots { font-size: 12px; font-weight: 700; color: var(--orange); margin-top: 2px; }
.row .shots.zero { color: var(--red); }
.qty { min-width: 66px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.qty.zero { color: var(--red); }
.round {
  border: 1.5px solid var(--accent); color: var(--accent); background: transparent; width: 32px; height: 32px;
  border-radius: 16px; font-size: 20px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.round:disabled { opacity: .3; }
.empty { text-align: center; color: var(--sub); padding: 40px 20px; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
  background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button { flex: 1; border: none; background: none; padding: 8px 0 6px; font-size: 11px; color: var(--sub); }
nav.tabs button .ico { display: block; font-size: 22px; margin-bottom: 2px; }
nav.tabs button.on { color: var(--accent); }

/* 시트(팝업 화면) */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.35); display: none; }
.sheet-wrap.open { display: block; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top) + 24px);
  background: var(--bg); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 17px; margin: 0; text-align: center; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
.link { border: none; background: none; color: var(--accent); font-size: 16px; padding: 4px; min-width: 50px; }
.link.bold { font-weight: 700; }
.link:disabled { opacity: .35; }
.sheet-body { overflow-y: auto; flex: 1; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }

.field { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line); min-height: 48px; }
.field:first-child { border-top: none; }
.field label { flex: none; }
.field input, .field select { flex: 1; min-width: 0; border: none; background: transparent; text-align: right; outline: none; }
.field input.big { font-size: 28px; font-weight: 700; text-align: left; font-variant-numeric: tabular-nums; }
.field input.left { text-align: left; }
.field .unit { color: var(--sub); }
.quick { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.quick button { flex: 1; border: none; border-radius: 8px; padding: 8px 0; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.primary { display: block; width: calc(100% - 32px); margin: 16px; border: none; border-radius: 12px; padding: 14px; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; }
.primary.done { background: var(--green); }
.primary:disabled { opacity: .4; }
.danger { display: block; width: 100%; border: none; background: none; color: var(--red); padding: 14px 16px; text-align: left; }
.plain { display: block; width: 100%; border: none; background: none; color: var(--accent); padding: 14px 16px; text-align: left; border-top: 1px solid var(--line); }
.plain:first-child { border-top: none; }
.note { color: var(--sub); font-size: 13px; padding: 6px 20px 0; }

.hrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-top: 1px solid var(--line); }
.hrow:first-child { border-top: none; }
.hrow .l { flex: 1; min-width: 0; }
.hrow .d { font-size: 15px; }
.hrow .m { font-size: 12px; color: var(--sub); margin-top: 2px; }
.hrow .r { text-align: right; font-variant-numeric: tabular-nums; }
.hrow .r .prev { color: var(--sub); }
.hrow .r .s { font-size: 12px; color: var(--orange); }
.del { border: none; background: none; color: var(--sub); font-size: 18px; padding: 4px 6px; }
.toggle { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--line); position: relative; flex: none !important; transition: .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: .2s; }
.toggle:checked { background: var(--green); }
.toggle:checked::after { left: 22px; }

.toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 100;
  background: rgba(30,30,30,.92); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px;
  opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; }
.install-tip { margin: 12px 16px 0; background: var(--accent-soft); color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.install-tip button { float: right; border: none; background: none; color: var(--sub); font-size: 18px; margin: -6px -6px 0 0; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); padding: 6px 20px 0; cursor: pointer; }
.sdot { width: 8px; height: 8px; border-radius: 4px; background: var(--sub); flex: none; }
.sdot.ok { background: var(--green); } .sdot.busy { background: var(--orange); } .sdot.err { background: var(--red); } .sdot.off { background: var(--line); border: 1px solid var(--sub); }
.steps { padding: 12px 16px; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div id="page-stock">
  <header class="top">
    <div class="titlebar">
      <button class="icon-btn" id="btn-menu" aria-label="메뉴">⋯</button>
      <h1>병원 재고</h1>
      <button class="icon-btn" id="btn-add" aria-label="품목 추가">＋</button>
    </div>
    <div class="datebar">
      <button class="chip" id="prev-day" aria-label="전날">‹</button>
      <input type="date" id="date">
      <button class="chip" id="next-day" aria-label="다음날">›</button>
      <button class="chip" id="today">오늘</button>
    </div>
    <input class="search" id="search" type="search" placeholder="품목 검색">
  </header>
  <div id="install-tip"></div>
  <div class="sync" id="sync"></div>
  <div class="hint" id="date-hint"></div>
  <div id="list"></div>
</div>

<div id="page-history" hidden>
  <header class="top"><div class="titlebar"><span style="width:38px"></span><h1>날짜별 기록</h1><span style="width:38px"></span></div></header>
  <div id="history"></div>
</div>

<nav class="tabs">
  <button id="tab-stock" class="on"><span class="ico">📦</span>재고</button>
  <button id="tab-history"><span class="ico">📅</span>날짜별 기록</button>
</nav>

<div class="sheet-wrap" id="sheet"><div class="sheet" id="sheet-inner"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
