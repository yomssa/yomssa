<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>병원 재고</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="병원 재고">
<meta name="theme-color" content="#0d7399">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #f2f2f7; --card: #ffffff; --text: #111; --sub: #6b6b70; --line: #e3e3e8;
  --accent: #0d7399; --accent-soft: #e2f1f7; --red: #e0352b; --orange: #d97706; --green: #1a8f4a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --card: #1c1c1e; --text: #f2f2f2; --sub: #9a9aa0; --line: #2e2e32;
    --accent: #4fb3d9; --accent-soft: #10303d; --red: #ff5a4f; --orange: #f5a524; --green: #3ccf75;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 16px; padding-bottom: calc(70px + env(safe-area-inset-bottom));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

header.top {
  position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
}
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 28px; margin: 4px 0; }
.icon-btn {
  border: none; background: var(--accent-soft); color: var(--accent); width: 38px; height: 38px;
  border-radius: 19px; font-size: 22px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
}
.datebar { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.datebar input[type=date] {
  flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); font-weight: 600; text-align: center;
}
.chip { border: none; background: var(--card); border-radius: 10px; padding: 8px 12px; color: var(--accent); font-weight: 600; }
.search {
  width: 100%; margin-top: 8px; padding: 9px 12px; border-radius: 10px; border: none;
  background: color-mix(in srgb, var(--sub) 15%, transparent);
}
.hint { color: var(--sub); font-size: 13px; padding: 4px 20px 0; }

.group-title { color: var(--sub); font-size: 13px; font-weight: 600; padding: 18px 20px 6px; }
.card { background: var(--card); border-radius: 12px; margin: 0 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; border-top: 1px solid var(--line); min-height: 56px; }
.row:first-child { border-top: none; }
.row .info { flex: 1; min-width: 0; }
.row .name { font-weight: 500; display: flex; align-items: center; gap: 6px; }
.row .name .dot { width: 7px; height: 7px; border-radius: 4px; background: var(--accent); flex: none; }
.row .meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
.row .shots { font-size: 12px; font-weight: 700; color: var(--orange); margin-top: 2px; }
.row .shots.zero { color: var(--red); }
.qty { min-width: 66px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.qty.zero { color: var(--red); }
.round {
  border: 1.5px solid var(--accent); color: var(--accent); background: transparent; width: 32px; height: 32px;
  border-radius: 16px; font-size: 20px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.round:disabled { opacity: .3; }
.empty { text-align: center; color: var(--sub); padding: 40px 20px; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
  background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button { flex: 1; border: none; background: none; padding: 8px 0 6px; font-size: 11px; color: var(--sub); }
nav.tabs button .ico { display: block; font-size: 22px; margin-bottom: 2px; }
nav.tabs button.on { color: var(--accent); }

/* 시트(팝업 화면) */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.35); display: none; }
.sheet-wrap.open { display: block; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top) + 24px);
  background: var(--bg); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 17px; margin: 0; text-align: center; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
.link { border: none; background: none; color: var(--accent); font-size: 16px; padding: 4px; min-width: 50px; }
.link.bold { font-weight: 700; }
.link:disabled { opacity: .35; }
.sheet-body { overflow-y: auto; flex: 1; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }

.field { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line); min-height: 48px; }
.field:first-child { border-top: none; }
.field label { flex: none; }
.field input, .field select { flex: 1; min-width: 0; border: none; background: transparent; text-align: right; outline: none; }
.field input.big { font-size: 28px; font-weight: 700; text-align: left; font-variant-numeric: tabular-nums; }
.field input.left { text-align: left; }
.field .unit { color: var(--sub); }
.quick { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.quick button { flex: 1; border: none; border-radius: 8px; padding: 8px 0; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.primary { display: block; width: calc(100% - 32px); margin: 16px; border: none; border-radius: 12px; padding: 14px; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; }
.primary.done { background: var(--green); }
.primary:disabled { opacity: .4; }
.danger { display: block; width: 100%; border: none; background: none; color: var(--red); padding: 14px 16px; text-align: left; }
.plain { display: block; width: 100%; border: none; background: none; color: var(--accent); padding: 14px 16px; text-align: left; border-top: 1px solid var(--line); }
.plain:first-child { border-top: none; }
.note { color: var(--sub); font-size: 13px; padding: 6px 20px 0; }

.hrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-top: 1px solid var(--line); }
.hrow:first-child { border-top: none; }
.hrow .l { flex: 1; min-width: 0; }
.hrow .d { font-size: 15px; }
.hrow .m { font-size: 12px; color: var(--sub); margin-top: 2px; }
.hrow .r { text-align: right; font-variant-numeric: tabular-nums; }
.hrow .r .prev { color: var(--sub); }
.hrow .r .s { font-size: 12px; color: var(--orange); }
.del { border: none; background: none; color: var(--sub); font-size: 18px; padding: 4px 6px; }
.toggle { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--line); position: relative; flex: none !important; transition: .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: .2s; }
.toggle:checked { background: var(--green); }
.toggle:checked::after { left: 22px; }

.toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 100;
  background: rgba(30,30,30,.92); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px;
  opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; }
.install-tip { margin: 12px 16px 0; background: var(--accent-soft); color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.install-tip button { float: right; border: none; background: none; color: var(--sub); font-size: 18px; margin: -6px -6px 0 0; }
</style>
</head>
<body>

<div id="page-stock">
  <header class="top">
    <div class="titlebar">
      <button class="icon-btn" id="btn-menu" aria-label="메뉴">⋯</button>
      <h1>병원 재고</h1>
      <button class="icon-btn" id="btn-add" aria-label="품목 추가">＋</button>
    </div>
    <div class="datebar">
      <button class="chip" id="prev-day" aria-label="전날">‹</button>
      <input type="date" id="date">
      <button class="chip" id="next-day" aria-label="다음날">›</button>
      <button class="chip" id="today">오늘</button>
    </div>
    <input class="search" id="search" type="search" placeholder="품목 검색">
  </header>
  <div id="install-tip"></div>
  <div class="hint" id="date-hint"></div>
  <div id="list"></div>
</div>

<div id="page-history" hidden>
  <header class="top"><div class="titlebar"><span style="width:38px"></span><h1>날짜별 기록</h1><span style="width:38px"></span></div></header>
  <div id="history"></div>
</div>

<nav class="tabs">
  <button id="tab-stock" class="on"><span class="ico">📦</span>재고</button>
  <button id="tab-history"><span class="ico">📅</span>날짜별 기록</button>
</nav>

<div class="sheet-wrap" id="sheet"><div class="sheet" id="sheet-inner"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script>
"use strict";
// ───────── 기본 품목 (처음 실행 시 등록) ─────────
const SEED = [
  ["울쎄라팁 주황 (1.0-1.5)", "울쎄라", "개", 1, 300],
  ["울쎄라팁 초록 (7-3.0)", "울쎄라", "개", 1, 198],
  ["울쎄라팁 파랑 (4-4.5)", "울쎄라", "개", 1, 0],
  ["써마지 600샷", "써마지", "개", 0],
  ["써마지 300샷", "써마지", "개", 0],
  ["써마지 아이 450샷", "써마지", "개", 1],
  ["덴서티 클래식", "덴서티", "개", 0],
  ["덴서티 알파", "덴서티", "개", 0],
  ["덴서티 하이", "덴서티", "개", 2],
  ["리쥬란", "리쥬란", "개", 21],
  ["리쥬란 HB", "리쥬란", "개", 4],
  ["리쥬란 i", "리쥬란", "개", 5],
  ["뉴라미스 클래식", "필러", "개", 3],
  ["뉴라미스 딥", "필러", "개", 6],
  ["레스틸렌", "필러", "개", 3],
  ["레스틸렌 키스", "필러", "개", 5],
  ["레스틸렌 리프트", "필러", "개", 2],
  ["쥬비덤 볼루마", "필러", "개", 2],
  ["쥬비덤 볼리프트", "필러", "개", 3],
  ["바이리즌", "필러", "개", 4],
  ["보툴렉스 50", "보톡스", "개", 4],
  ["보툴렉스 100", "보톡스", "개", 0],
  ["보툴렉스 150", "보톡스", "개", 0],
  ["보툴렉스 200", "보톡스", "개", 10],
  ["엘러간 50", "보톡스", "개", 1],
  ["쥬베룩 스킨", "쥬베룩", "개", 6],
  ["쥬베룩 볼륨", "쥬베룩", "개", 7],
  ["줄기세포 30", "줄기세포", "개", 6],
  ["줄기세포 60", "줄기세포", "개", 5],
  ["줄기세포 120", "줄기세포", "개", 2],
  ["줄기세포 240", "줄기세포", "개", 1],
  ["민트 파인 (x4)", "실·보형물", "팩", 24],
  ["엘라텐스 페이스", "실·보형물", "개", 0, null, "모델명 18085"],
  ["엘라텐스 넥", "실·보형물", "개", 3, null, "모델명 17085"],
  ["기증늑", "실·보형물", "개", 1],
  ["메가덤", "실·보형물", "개", 7],
  ["포폴", "약품", "바이알", 33],
  ["미다", "약품", "앰플", 33.6],
  ["케타", "약품", "앰플", 28.6],
];
const UNITS = ["개", "샷", "팩", "바이알", "앰플", "박스", "병", "cc", "ml"];
const KEY = "hospital-inventory-v1";

// ───────── 유틸 ─────────
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = (n) => String(n).padStart(2, "0");
const toDay = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => toDay(new Date());
const fmtQty = (n) => (Math.round(n * 100) / 100).toString();
const num = (s) => { const v = parseFloat(String(s).replace(",", ".")); return isNaN(v) ? null : v; };
function korDay(day) {
  const [y, m, d] = day.split("-").map(Number);
  const w = "일월화수목금토"[new Date(y, m - 1, d).getDay()];
  return `${y}년 ${m}월 ${d}일 (${w})`;
}
function shiftDay(day, n) {
  const [y, m, d] = day.split("-").map(Number);
  return toDay(new Date(y, m - 1, d + n));
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ───────── 데이터 ─────────
let db = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.items)) return d; }
  } catch (e) {}
  const t = today(), items = [], entries = [];
  SEED.forEach(([name, category, unit, qty, shots, note], i) => {
    const id = uid() + i;
    const tracksShots = shots !== undefined && shots !== null;
    items.push({ id, name, category, unit, tracksShots, note: note || "", sortOrder: i });
    entries.push({ id: uid() + "e" + i, itemId: id, date: t, qty, shots: tracksShots ? shots : null, memo: "초기 재고", seed: true, updatedAt: Date.now() });
  });
  const d = { items, entries };
  save(d);
  return d;
}
function save(d = db) {
  try { localStorage.setItem(KEY, JSON.stringify(d)); }
  catch (e) { toast("저장에 실패했어요. 백업을 내려받아 두세요."); }
}
const sorted = () => [...db.items].sort((a, b) => a.sortOrder - b.sortOrder);
function categories() {
  const seen = new Set(), out = [];
  for (const it of sorted()) if (!seen.has(it.category)) { seen.add(it.category); out.push(it.category); }
  return out;
}
const itemById = (id) => db.items.find((i) => i.id === id);
// 해당 날짜 기준 재고 = 그 날짜 이전(포함) 가장 최근 기록
function stockOn(itemId, day) {
  let best = null;
  for (const e of db.entries) if (e.itemId === itemId && e.date <= day && (!best || e.date > best.date)) best = e;
  return best;
}
const entryOn = (itemId, day) => db.entries.find((e) => e.itemId === itemId && e.date === day) || null;
function prevStock(itemId, day) {
  let best = null;
  for (const e of db.entries) if (e.itemId === itemId && e.date < day && (!best || e.date > best.date)) best = e;
  return best;
}
function setStock(itemId, day, qty, shots, memo) {
  const e = entryOn(itemId, day);
  if (e) Object.assign(e, { qty, shots, memo, seed: false, updatedAt: Date.now() });
  else db.entries.push({ id: uid(), itemId, date: day, qty, shots, memo, updatedAt: Date.now() });
  save();
}
function nextSortOrder(category) {
  const inCat = db.items.filter((i) => i.category === category).map((i) => i.sortOrder);
  const order = inCat.length ? Math.max(...inCat) + 1 : Math.max(-1, ...db.items.map((i) => i.sortOrder)) + 1;
  db.items.forEach((i) => { if (i.sortOrder >= order) i.sortOrder++; });
  return order;
}

// ───────── 상태 ─────────
let day = today();
let search = "";
let tab = "stock";

// ───────── 재고 목록 ─────────
function renderList() {
  $("#date").value = day;
  const isToday = day === today();
  $("#today").style.display = isToday ? "none" : "";
  $("#date-hint").textContent = isToday ? "오늘 재고" : `${korDay(day)} 기준 재고`;
  const q = search.trim().toLowerCase();
  let html = "";
  for (const cat of categories()) {
    const rows = sorted().filter((i) => i.category === cat &&
      (!q || (i.name + " " + i.category + " " + i.note).toLowerCase().includes(q)));
    if (!rows.length) continue;
    html += `<div class="group-title">${esc(cat)}</div><div class="card">`;
    for (const it of rows) {
      const s = stockOn(it.id, day);
      const qty = s ? s.qty : 0;
      const todays = entryOn(it.id, day);
      const edited = !!todays && !todays.seed;
      const shots = s && s.shots != null ? s.shots : 0;
      html += `<div class="row" data-id="${it.id}">
        <div class="info" data-open="${it.id}">
          <div class="name">${esc(it.name)}${edited ? '<span class="dot" title="이 날짜에 수정됨"></span>' : ""}</div>
          ${it.note ? `<div class="meta">${esc(it.note)}</div>` : ""}
          ${it.tracksShots ? `<div class="shots ${shots === 0 ? "zero" : ""}">${shots}샷 남음</div>` : ""}
        </div>
        <button class="round" data-adj="-1" data-id="${it.id}" ${qty <= 0 ? "disabled" : ""} aria-label="빼기">−</button>
        <div class="qty ${qty <= 0 ? "zero" : ""}" data-open="${it.id}">${fmtQty(qty)}${esc(it.unit)}</div>
        <button class="round" data-adj="1" data-id="${it.id}" aria-label="더하기">＋</button>
      </div>`;
    }
    html += `</div>`;
  }
  $("#list").innerHTML = html || `<div class="empty">${q ? "검색 결과가 없어요" : "품목이 없어요. ＋ 버튼으로 추가하세요"}</div>`;
}
$("#list").addEventListener("click", (ev) => {
  const adj = ev.target.closest("[data-adj]");
  if (adj) {
    const id = adj.dataset.id, s = stockOn(id, day), e = entryOn(id, day);
    const q = Math.max(0, (s ? s.qty : 0) + Number(adj.dataset.adj));
    setStock(id, day, q, s ? s.shots : null, e ? e.memo : "");
    renderList();
    return;
  }
  const open = ev.target.closest("[data-open]");
  if (open) openDetail(open.dataset.open);
});
$("#date").addEventListener("change", (e) => { if (e.target.value) { day = e.target.value; renderList(); } });
$("#prev-day").onclick = () => { day = shiftDay(day, -1); renderList(); };
$("#next-day").onclick = () => { day = shiftDay(day, 1); renderList(); };
$("#today").onclick = () => { day = today(); renderList(); };
$("#search").addEventListener("input", (e) => { search = e.target.value; renderList(); });
$("#btn-add").onclick = () => openForm(null);
$("#btn-menu").onclick = openMenu;

// ───────── 시트 공통 ─────────
let onSheetClose = null;
function openSheet(html, onClose) {
  $("#sheet-inner").innerHTML = html;
  $("#sheet").classList.add("open");
  document.body.style.overflow = "hidden";
  onSheetClose = onClose || null;
}
function closeSheet() {
  $("#sheet").classList.remove("open");
  document.body.style.overflow = "";
  const cb = onSheetClose; onSheetClose = null;
  if (cb) cb();
  render();
}
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") closeSheet(); });

// ───────── 품목 상세 (날짜별 수량 수정) ─────────
function openDetail(id, startDay) {
  const it = itemById(id); if (!it) return;
  let dday = startDay || day;
  const draw = () => {
    const s = stockOn(id, dday), e = entryOn(id, dday);
    const hist = db.entries.filter((x) => x.itemId === id).sort((a, b) => (a.date < b.date ? 1 : -1));
    openSheet(`
      <div class="sheet-head">
        <button class="link" data-act="close">닫기</button>
        <h2>${esc(it.name)}</h2>
        <span style="min-width:50px"></span>
      </div>
      <div class="sheet-body">
        <div class="group-title">날짜</div>
        <div class="card"><div class="field"><label>날짜</label><input type="date" id="d-date" value="${dday}"></div></div>
        ${!e && s ? `<div class="note">이 날짜엔 기록이 없어 ${korDay(s.date)} 기록을 보여주고 있어요.</div>` : ""}
        <div class="group-title">재고 수량</div>
        <div class="card">
          <div class="field"><input class="big" id="d-qty" inputmode="decimal" value="${fmtQty(s ? s.qty : 0)}"><span class="unit">${esc(it.unit)}</span></div>
          <div class="quick">
            <button data-q="-1">−1</button><button data-q="1">+1</button><button data-q="5">+5</button><button data-q="10">+10</button>
          </div>
          ${it.tracksShots ? `<div class="field"><label>남은 샷</label><input id="d-shots" inputmode="numeric" value="${s && s.shots != null ? s.shots : 0}"><span class="unit">샷</span></div>` : ""}
          <div class="field"><input class="left" id="d-memo" placeholder="메모 (예: 입고, 시술 사용)" value="${esc(e ? e.memo : "")}"></div>
        </div>
        <button class="primary" id="d-save">${korDay(dday)} 재고로 저장</button>
        <div class="group-title">변경 기록 (누르면 그 날짜로 이동)</div>
        <div class="card">
          ${hist.length ? hist.map((h) => histRow(h, it, true)).join("") : `<div class="hrow"><div class="l m">기록 없음</div></div>`}
        </div>
        <div class="group-title">품목</div>
        <div class="card">
          <button class="plain" data-act="edit">품목 정보 수정</button>
          <button class="danger" data-act="delete" style="border-top:1px solid var(--line)">품목 삭제</button>
        </div>
      </div>`);
    const sheet = $("#sheet-inner");
    sheet.querySelector("#d-date").onchange = (ev) => { if (ev.target.value) { dday = ev.target.value; day = dday; draw(); } };
    sheet.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => {
      const inp = $("#d-qty"); inp.value = fmtQty(Math.max(0, (num(inp.value) || 0) + Number(b.dataset.q)));
    });
    sheet.querySelector("#d-save").onclick = () => {
      const q = num($("#d-qty").value);
      if (q === null) { toast("수량을 숫자로 입력해 주세요"); return; }
      const shots = it.tracksShots ? (parseInt($("#d-shots").value, 10) || 0) : null;
      setStock(id, dday, Math.max(0, q), shots, $("#d-memo").value.trim());
      toast("저장했어요");
      draw();
      const btn = $("#d-save"); btn.textContent = "저장됨 ✓"; btn.classList.add("done");
    };
    sheet.querySelectorAll("[data-goto]").forEach((r) => r.onclick = (ev) => {
      if (ev.target.closest("[data-del]")) return;
      dday = r.dataset.goto; day = dday; draw();
    });
    sheet.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
      const h = db.entries.find((x) => x.id === b.dataset.del);
      if (h && confirm(`${korDay(h.date)} 기록을 삭제할까요?`)) {
        db.entries = db.entries.filter((x) => x.id !== h.id); save(); draw();
      }
    });
    sheet.querySelector('[data-act="close"]').onclick = closeSheet;
    sheet.querySelector('[data-act="edit"]').onclick = () => openForm(it, () => openDetail(id, dday));
    sheet.querySelector('[data-act="delete"]').onclick = () => {
      if (confirm(`'${it.name}' 품목과 모든 기록을 삭제할까요?`)) {
        db.items = db.items.filter((x) => x.id !== id);
        db.entries = db.entries.filter((x) => x.itemId !== id);
        save(); closeSheet(); toast("삭제했어요");
      }
    };
  };
  draw();
}

function histRow(h, it, clickable) {
  const p = prevStock(h.itemId, h.date);
  return `<div class="hrow" ${clickable ? `data-goto="${h.date}"` : ""}>
    <div class="l">
      <div class="d">${clickable ? korDay(h.date) : esc(it.name)}</div>
      ${h.memo ? `<div class="m">${esc(h.memo)}</div>` : ""}
    </div>
    <div class="r">
      <div>${p ? `<span class="prev">${fmtQty(p.qty)} → </span>` : ""}<b>${fmtQty(h.qty)}${esc(it.unit)}</b></div>
      ${it.tracksShots ? `<div class="s">${p && p.shots != null && p.shots !== h.shots ? p.shots + " → " : ""}${h.shots ?? 0}샷</div>` : ""}
    </div>
    <button class="del" data-del="${h.id}" aria-label="기록 삭제">✕</button>
  </div>`;
}

// ───────── 품목 추가 / 수정 ─────────
function openForm(item, after) {
  const isEdit = !!item;
  const cats = categories();
  const curCat = isEdit ? item.category : (cats[0] || "");
  const curUnit = isEdit ? item.unit : "개";
  const customUnit = !UNITS.includes(curUnit);
  openSheet(`
    <div class="sheet-head">
      <button class="link" data-act="cancel">취소</button>
      <h2>${isEdit ? "품목 수정" : "새 품목 추가"}</h2>
      <button class="link bold" data-act="ok">${isEdit ? "저장" : "추가"}</button>
    </div>
    <div class="sheet-body">
      <div class="group-title">품목</div>
      <div class="card">
        <div class="field"><input class="left" id="f-name" placeholder="품목 이름 (예: 리쥬란 HB)" value="${esc(isEdit ? item.name : "")}"></div>
        <div class="field"><input class="left" id="f-note" placeholder="메모 / 모델명 (선택)" value="${esc(isEdit ? item.note : "")}"></div>
      </div>
      <div class="group-title">분류</div>
      <div class="card">
        <div class="field"><label>카테고리</label>
          <select id="f-cat">${cats.map((c) => `<option ${c === curCat ? "selected" : ""}>${esc(c)}</option>`).join("")}<option value="__new__" ${cats.length ? "" : "selected"}>새 카테고리…</option></select>
        </div>
        <div class="field" id="f-newcat-row" ${cats.length ? "hidden" : ""}><input class="left" id="f-newcat" placeholder="새 카테고리 이름"></div>
        <div class="field"><label>단위</label>
          <select id="f-unit">${UNITS.map((u) => `<option ${u === curUnit ? "selected" : ""}>${u}</option>`).join("")}<option value="__custom__" ${customUnit ? "selected" : ""}>직접 입력…</option></select>
        </div>
        <div class="field" id="f-cunit-row" ${customUnit ? "" : "hidden"}><input class="left" id="f-cunit" placeholder="단위" value="${esc(customUnit ? curUnit : "")}"></div>
        <div class="field"><label for="f-shots-on" style="flex:1">남은 샷 수 관리 (울쎄라 팁 등)</label><input type="checkbox" class="toggle" id="f-shots-on" ${isEdit && item.tracksShots ? "checked" : ""}></div>
      </div>
      ${isEdit ? "" : `
      <div class="group-title">현재 재고</div>
      <div class="card">
        <div class="field"><label>등록 날짜</label><input type="date" id="f-date" value="${day}"></div>
        <div class="field"><label>수량</label><input id="f-qty" inputmode="decimal" value="0"></div>
        <div class="field" id="f-shots-row" hidden><label>남은 샷</label><input id="f-shots" inputmode="numeric" value="0"></div>
      </div>`}
    </div>`);
  const s = $("#sheet-inner");
  const syncRows = () => {
    s.querySelector("#f-newcat-row").hidden = $("#f-cat").value !== "__new__";
    s.querySelector("#f-cunit-row").hidden = $("#f-unit").value !== "__custom__";
    const sr = s.querySelector("#f-shots-row"); if (sr) sr.hidden = !$("#f-shots-on").checked;
  };
  ["#f-cat", "#f-unit", "#f-shots-on"].forEach((q) => s.querySelector(q).addEventListener("change", syncRows));
  syncRows();
  s.querySelector('[data-act="cancel"]').onclick = () => { closeSheet(); if (after) after(); };
  s.querySelector('[data-act="ok"]').onclick = () => {
    const name = $("#f-name").value.trim();
    const category = ($("#f-cat").value === "__new__" ? $("#f-newcat").value : $("#f-cat").value).trim();
    const unit = ($("#f-unit").value === "__custom__" ? $("#f-cunit").value : $("#f-unit").value).trim();
    const tracksShots = $("#f-shots-on").checked;
    const note = $("#f-note").value.trim();
    if (!name) return toast("품목 이름을 입력해 주세요");
    if (!category) return toast("카테고리를 입력해 주세요");
    if (!unit) return toast("단위를 입력해 주세요");
    if (isEdit) {
      if (item.category !== category) item.sortOrder = nextSortOrder(category);
      Object.assign(item, { name, category, unit, tracksShots, note });
      save(); closeSheet(); toast("수정했어요");
      if (after) after();
    } else {
      const qty = num($("#f-qty").value);
      if (qty === null) return toast("수량을 숫자로 입력해 주세요");
      const d = $("#f-date").value || day;
      const id = uid();
      db.items.push({ id, name, category, unit, tracksShots, note, sortOrder: nextSortOrder(category) });
      db.entries.push({ id: uid(), itemId: id, date: d, qty: Math.max(0, qty),
        shots: tracksShots ? (parseInt($("#f-shots").value, 10) || 0) : null, memo: "신규 등록", updatedAt: Date.now() });
      save(); closeSheet(); toast(`'${name}' 추가했어요`);
    }
  };
}

// ───────── 날짜별 기록 ─────────
function renderHistory() {
  const days = [...new Set(db.entries.map((e) => e.date))].sort().reverse();
  if (!days.length) { $("#history").innerHTML = `<div class="empty">아직 기록이 없어요</div>`; return; }
  $("#history").innerHTML = `<div style="height:8px"></div><div class="card">` + days.map((d) => {
    const n = db.entries.filter((e) => e.date === d).length;
    return `<div class="hrow" data-day="${d}"><div class="l"><div class="d">${korDay(d)}</div></div><div class="r m">${n}건 ›</div></div>`;
  }).join("") + `</div>`;
}
$("#history").addEventListener("click", (e) => {
  const r = e.target.closest("[data-day]"); if (r) openDay(r.dataset.day);
});
function openDay(d) {
  const draw = () => {
    const list = db.entries.filter((e) => e.date === d && itemById(e.itemId))
      .sort((a, b) => itemById(a.itemId).sortOrder - itemById(b.itemId).sortOrder);
    openSheet(`
      <div class="sheet-head">
        <button class="link" data-act="close">닫기</button>
        <h2>${korDay(d)}</h2>
        <button class="link" data-act="go">재고 보기</button>
      </div>
      <div class="sheet-body">
        <div class="group-title">이 날 바뀐 품목 ${list.length}개</div>
        <div class="card">${list.length ? list.map((h) => histRow(h, itemById(h.itemId), false)).join("") : `<div class="hrow"><div class="l m">기록 없음</div></div>`}</div>
      </div>`);
    const s = $("#sheet-inner");
    s.querySelector('[data-act="close"]').onclick = closeSheet;
    s.querySelector('[data-act="go"]').onclick = () => { day = d; switchTab("stock"); closeSheet(); };
    s.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
      if (confirm("이 기록을 삭제할까요?")) { db.entries = db.entries.filter((x) => x.id !== b.dataset.del); save(); draw(); }
    });
  };
  draw();
}

// ───────── 메뉴: 내보내기 / 백업 ─────────
function openMenu() {
  openSheet(`
    <div class="sheet-head"><span style="min-width:50px"></span><h2>메뉴</h2><button class="link" data-act="close">닫기</button></div>
    <div class="sheet-body">
      <div class="group-title">내보내기</div>
      <div class="card"><button class="plain" data-act="csv">${korDay(day)} 재고표 (엑셀용 CSV)</button></div>
      <div class="group-title">백업 (휴대폰 바꿀 때나 만일을 대비해)</div>
      <div class="card">
        <button class="plain" data-act="backup">백업 파일 저장</button>
        <button class="plain" data-act="restore">백업 파일 불러오기</button>
      </div>
      <div class="note">데이터는 이 아이폰 안에만 저장됩니다. 가끔 백업 파일을 저장해 두세요.</div>
    </div>`);
  const s = $("#sheet-inner");
  s.querySelector('[data-act="close"]').onclick = closeSheet;
  s.querySelector('[data-act="csv"]').onclick = exportCSV;
  s.querySelector('[data-act="backup"]').onclick = () =>
    shareFile(`병원재고_백업_${today()}.json`, JSON.stringify(db), "application/json");
  s.querySelector('[data-act="restore"]').onclick = () => $("#import-file").click();
}
function exportCSV() {
  const cell = (v) => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const lines = ["카테고리,품목,수량,단위,남은샷,메모"];
  for (const it of sorted()) {
    const s = stockOn(it.id, day);
    lines.push([it.category, it.name, fmtQty(s ? s.qty : 0), it.unit, it.tracksShots ? (s && s.shots != null ? s.shots : 0) : "", it.note].map(cell).join(","));
  }
  shareFile(`병원재고_${day}.csv`, "﻿" + lines.join("\n"), "text/csv");
}
async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$("#import-file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.items) || !Array.isArray(d.entries)) throw new Error();
    if (!confirm(`백업(품목 ${d.items.length}개)으로 지금 데이터를 바꿀까요?`)) return;
    db = d; save(); closeSheet(); toast("백업을 불러왔어요");
  } catch (err) { toast("백업 파일을 읽을 수 없어요"); }
});

// ───────── 탭 / 설치 안내 ─────────
function switchTab(t) {
  tab = t;
  $("#page-stock").hidden = t !== "stock";
  $("#page-history").hidden = t !== "history";
  $("#tab-stock").classList.toggle("on", t === "stock");
  $("#tab-history").classList.toggle("on", t === "history");
  render(); window.scrollTo(0, 0);
}
$("#tab-stock").onclick = () => switchTab("stock");
$("#tab-history").onclick = () => switchTab("history");
function render() { tab === "stock" ? renderList() : renderHistory(); }

(function installTip() {
  const standalone = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  let hidden = false; try { hidden = localStorage.getItem("tip-hidden") === "1"; } catch (e) {}
  if (standalone || hidden) return;
  $("#install-tip").innerHTML = `<div class="install-tip"><button aria-label="닫기">✕</button>
    <b>앱처럼 쓰려면</b><br>Safari 아래쪽 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 누르세요.</div>`;
  $("#install-tip button").onclick = () => { try { localStorage.setItem("tip-hidden", "1"); } catch (e) {} $("#install-tip").innerHTML = ""; };
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// 앱을 다시 열었을 때 날짜가 바뀌었으면 오늘로
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !$("#sheet").classList.contains("open")) render();
});
render();
</script>
</body>
</html>
